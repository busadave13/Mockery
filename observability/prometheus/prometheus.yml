# Prometheus configuration for Mockery observability
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files (optional)
rule_files: []

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Mockery application metrics
  - job_name: 'mockery'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['mockery:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'mockery'
