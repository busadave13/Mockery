# Grafana dashboard provisioning
apiVersion: 1

providers:
  - name: 'Mockery Dashboards'
    orgId: 1
    folder: 'Mockery'
    folderUid: 'mockery'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
