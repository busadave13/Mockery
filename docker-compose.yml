services:
  mockery:
    build: .
    ports:
      - "3000:8080"
    volumes:
      - ${MOCKS_PATH}:/app/mocks
    environment:
      - MockRepository__Type=Local
      - MockRepository__LocalPath=/app
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:18889
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=Mockery
