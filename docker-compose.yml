services:
  mockery:
    build:
      context: .
      dockerfile: Dockerfile
      # Force rebuild - no cache
      args:
        BUILDKIT_INLINE_CACHE: 0
    image: mockery:local
    container_name: mockery
    ports:
      - "8080:8080"
    environment:
      # ASP.NET Core Environment (defaults to Production)
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080

    # Optional: Persist cloned Git repository across container restarts
    # Uncomment if using Git mode (configured in appsettings.Production.json)
    volumes:
      - mockery-data:/app/mocks

    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

volumes:
  mockery-data:
    driver: local
