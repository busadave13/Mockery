services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: aspire-dashboard
    restart: unless-stopped
    ports:
      - "18888:18888"  # Dashboard UI
      - "18889:18889"  # OpenTelemetry gRPC endpoint
    environment:
      - DOTNET_LOGS_CONSOLE_FORMAT=Json
      - DOTNET_RUNNING_IN_CONTAINER=true
      - DOTNET_ASPIRE_AUTHENTICATION_DISABLED=true
    networks:
      - aspire_network

  mockery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mockery
    ports:
      - "8080:8080"
    environment:
      # ASP.NET Core Environment (defaults to Development for Docker Desktop)
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # Override LocalPath for Docker environment (mocks folder is mounted at /app/mocks)
      - MockRepository__LocalPath=/app

    # Mount local mocks folder for Development environment
    volumes:
      - ./mocks:/app/mocks:ro  # Read-only mount of local mocks folder

    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped
    networks:
      - aspire_network
    depends_on:
      - aspire-dashboard

networks:
  aspire_network:
    driver: bridge
