apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.name }}-svc"
  labels:
    app: {{ .Values.name }}
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: TCP
    name: http
  selector:
    app: {{ .Values.name }}
    release: {{ .Release.Name }}
