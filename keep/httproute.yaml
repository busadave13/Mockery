apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "{{ .Values.name }}-httproute"
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: gateway-api
      namespace: istio-ingress
  hostnames:
    - mockery.local.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: "{{ .Values.name }}-svc"
          namespace: {{ .Values.namespace }}
          port: {{ .Values.service.port }}
