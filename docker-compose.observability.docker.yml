# Docker Compose Override for Full Docker Stack
# Use this in combination with docker-compose.observability.yml
# when you want to run Mockery in Docker alongside the observability stack
#
# Usage:
#   docker compose -f docker-compose.observability.yml -f docker-compose.observability.docker.yml up -d
#
# This override:
#   - Adds the Mockery service
#   - Switches Prometheus to scrape the Docker Mockery service instead of host

services:
  # Mockery service running in Docker
  mockery:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Throttling__Enabled=true
      - Throttling__RequestsPerSecond=100
      - Throttling__BurstSize=50
    volumes:
      - ./mocks:/app/mocks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mockery-net

  # Override Prometheus to use Docker config (scrapes mockery:8080)
  prometheus:
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - mockery
