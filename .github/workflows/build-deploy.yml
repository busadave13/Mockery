name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read

env:
  AZURE_CONTAINER_APP_NAME: your-app-name
  AZURE_RESOURCE_GROUP: global
  IMAGE_NAME: your-image-name
  DOTNET_VERSION: '8.0.x'  # Adjust to your .NET version

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run unit tests
      run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
      env:
        # Environment variables for tests
        ASPNETCORE_ENVIRONMENT: Testing
        ConnectionStrings__DefaultConnection: ${{ secrets.TEST_CONNECTION_STRING }}
        # Add any other test-specific environment variables here

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()  # Upload even if tests fail
      with:
        name: test-results
        path: '**/TestResults/*.trx'

  build-and-deploy:
    needs: test  # Only deploy if tests pass
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login with OIDC
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Log in to Azure Container Registry
      run: |
        az acr login --name <your-registry-name>

    - name: Build and push Docker image
      run: |
        docker build -t <your-registry>.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} .
        docker push <your-registry>.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

    - name: Deploy to Azure Container Apps
      uses: azure/container-apps-deploy-action@v1
      with:
        containerAppName: ${{ env.AZURE_CONTAINER_APP_NAME }}
        resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
        imageToDeploy: <your-registry>.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
        environmentVariables: |
          ASPNETCORE_ENVIRONMENT=Production
          ApiSettings__BaseUrl=${{ secrets.API_BASE_URL }}
          ConnectionStrings__DefaultConnection=${{ secrets.PROD_CONNECTION_STRING }}
        secrets: |
            git-access-token=${{ secrets.MOCKERY_GIT_ACCESS_TOKEN }}








name: build-deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore src/Mockery/Mockery.csproj

      - name: Build
        run: dotnet build src/Mockery/Mockery.csproj -c Release --no-restore

      - name: Run tests
        run: dotnet test src/Mockery.Test/Mockery.Test.csproj --no-build --verbosity normal

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.MOCKERY_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: dasacr.azurecr.io
          registryUsername: ${{ secrets.MOCKERY_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.MOCKERY_REGISTRY_PASSWORD }}
          containerAppName: mockery
          resourceGroup: mockery
          imageToBuild: dasacr.azurecr.io/mockery:${{ github.sha }}
          dockerfilePath: Dockerfile
          environmentVariables: |
            GIT_REPOSITORY_URL=${{ secrets.MOCKERY_GIT_REPOSITORY_URL }}
            GIT_BRANCH=${{ secrets.MOCKERY_GIT_BRANCH }}
            GIT_ACCESS_TOKEN=secretref:git-access-token
          secrets: |
            git-access-token=${{ secrets.MOCKERY_GIT_ACCESS_TOKEN }}
