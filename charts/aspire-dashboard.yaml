---
# Namespace for Aspire Dashboard
apiVersion: v1
kind: Namespace
metadata:
  name: monitor

---
# Service Account for Aspire Dashboard
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aspire-dashboard
  namespace: monitor

---
# Deployment for Aspire Dashboard
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aspire-dashboard
  namespace: monitor
  labels:
    app: aspire-dashboard
    component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aspire-dashboard
  template:
    metadata:
      labels:
        app: aspire-dashboard
        component: observability
    spec:
      serviceAccountName: aspire-dashboard
      containers:
        - name: aspire-dashboard
          image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
          ports:
            - name: dashboard
              containerPort: 18888
              protocol: TCP
            - name: otlp-grpc
              containerPort: 18889
              protocol: TCP
            - name: otlp-http
              containerPort: 18890
              protocol: TCP
          env:
            - name: DOTNET_LOGS_CONSOLE_FORMAT
              value: "Json"
            - name: DOTNET_RUNNING_IN_CONTAINER
              value: "true"
            - name: DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS
              value: "true"
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 18888
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 18888
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 18888
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

---
# Service for Aspire Dashboard
apiVersion: v1
kind: Service
metadata:
  name: aspire
  namespace: monitor
  labels:
    app: aspire-dashboard
    component: observability
spec:
  type: ClusterIP
  ports:
    - name: dashboard
      port: 18888
      targetPort: 18888
      protocol: TCP
    - name: otlp-grpc
      port: 18889
      targetPort: 18889
      protocol: TCP
    - name: otlp-http
      port: 18890
      targetPort: 18890
      protocol: TCP
  selector:
    app: aspire-dashboard

---
# Service for NodePort access to Dashboard UI (for local development)
apiVersion: v1
kind: Service
metadata:
  name: aspire-dashboard-nodeport
  namespace: monitor
  labels:
    app: aspire-dashboard
    component: observability
spec:
  type: NodePort
  ports:
    - name: dashboard
      port: 18888
      targetPort: 18888
      nodePort: 31888
      protocol: TCP
  selector:
    app: aspire-dashboard
