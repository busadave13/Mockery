apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
    release: {{ .Release.Name }}
data:
  # Throttling configuration
  Throttling__Enabled: {{ .Values.config.throttling.enabled | quote }}
  Throttling__RequestsPerSecond: {{ .Values.config.throttling.requestsPerSecond | quote }}
  Throttling__BurstSize: {{ .Values.config.throttling.burstSize | quote }}
