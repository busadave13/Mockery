apiVersion: v1
kind: Service
metadata:
  name: mockery-svc
  labels:
    app: mockery
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: TCP
    name: http
  selector:
    app: mockery
    release: {{ .Release.Name }}
